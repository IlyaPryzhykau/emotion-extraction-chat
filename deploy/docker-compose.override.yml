# Dev override — applied automatically by `docker compose up` (alongside
# docker-compose.yml). Mounts the backend source into the container and runs
# uvicorn with --reload, so local code changes take effect without a rebuild.
# Not used on the server (the prod run only references docker-compose.yml).

services:
  app:
    volumes:
      # Live-mount the source over the image's copy for hot reload.
      - ../backend:/app
      # Shadow the host's .venv so it doesn't leak in or get watched by --reload.
      - /app/.venv
    # Migrations still run first (entrypoint), then this command takes over.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
