# Local/dev stack: Postgres + backend API. Caddy + frontend are added later.
# Migrations run automatically at app startup (see backend/entrypoint.sh).

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emotions
    ports:
      # host 5439 -> container 5432, so DBeaver connects on localhost:5439
      # without clashing with any local Postgres on 5432.
      - "5439:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emotions"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      # Brings in OPENAI_API_KEY, model names, SESSION_SECRET, DB_SCHEMA.
      - ../backend/.env
    environment:
      # Override the DB host: inside the network the database is "db", not localhost.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/emotions
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  db_data:
