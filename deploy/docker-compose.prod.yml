# PROD stack: Postgres + backend (code baked in) + Caddy serving the built
# frontend and proxying /api. Self-contained.
#   Local prod run:  docker compose -f docker-compose.prod.yml up -d --build
#   Server: set SITE_ADDRESS=<ip-with-dashes>.sslip.io for automatic HTTPS.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emotions
    # No host port published: reached only over the internal network.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emotions"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/emotions
    depends_on:
      db:
        condition: service_healthy
    # Not published — only Caddy talks to it, over the internal network.
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    environment:
      # ":80" for local prod runs; a real sslip.io host on the server -> auto-HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
